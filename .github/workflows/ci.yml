---
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      VERSOLVE_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - run: cargo run --locked --package xtask -- reuse
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace
      - run: cargo check --locked --workspace --no-default-features
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Packaging verifies the crate in the same target directory. Check that
      # the next build still embeds the version resolved from the repository.
      - run: cargo package --locked
      - run: cargo build --locked
      - name: Check the embedded version
        shell: bash
        run: |
          output="$(./target/debug/versolve --verbose --version)"
          echo "${output}"
          embedded="$(sed -n 's/^release: //p' <<< "${output}")"
          resolved="$(./target/debug/versolve -T v -B master -b "${VERSOLVE_BUILD_BRANCH}")"
          echo "embedded: ${embedded}"
          echo "resolved: ${resolved}"
          test "${embedded}" = "${resolved}"
          commit="$(sed -n 's/^commit-hash: //p' <<< "${output}")"
          test "${commit}" = "$(git rev-parse HEAD)"
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      VERSOLVE_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: cargo run --locked --package xtask -- e2e
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    env:
      VERSOLVE_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install the minimum supported Rust version
        run: |
          msrv="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "versolve") | .rust_version')"
          rustup toolchain install "${msrv}" --profile minimal
          echo "RUSTUP_TOOLCHAIN=${msrv}" >> "${GITHUB_ENV}"
      - run: cargo check --locked --workspace --all-targets
  deny:
    name: deny
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd
        with:
          command: check ${{ matrix.checks }}
