[package]
name = "versolve"
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.88.0"
description = "Resolve unique semantic version numbers for Git revisions"
license = "GPL-3.0-or-later"
repository = "https://github.com/anttikivi/versolve"
exclude = [".cargo", ".github", "renovate.json"]

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[workspace]
members = [".", "xtask"]

[dependencies]
git2 = { version = "0.21.0", default-features = false, features = [
  "vendored-libgit2",
] }
semver = "1.0.28"

[build-dependencies]
git2 = { version = "0.21.0", default-features = false, features = [
  "vendored-libgit2",
] }
semver = "1.0.28"

[dev-dependencies]
tempfile = "=3.27.0"
