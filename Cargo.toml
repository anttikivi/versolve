[package]
name = "versolve"
version = "0.3.0"
edition = "2024"
rust-version = "1.88.0"
description = "Resolve unique semantic version numbers for Git revisions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anttikivi/versolve"
keywords = ["git", "semver", "version", "versioning", "build"]
categories = ["development-tools::build-utils", "command-line-utilities"]
exclude = [".cargo", ".github", "deny.toml", "renovate.json"]

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[workspace]
members = [".", "xtask"]

[features]
default = ["vendored-libgit2"]
sha256 = ["git2/unstable-sha256"]
vendored-libgit2 = ["git2/vendored-libgit2"]

[dependencies]
git2 = { version = "0.21.0", default-features = false }
log = "0.4"
semver = "1.0.20"

[build-dependencies]
git2 = { version = "0.21.0", default-features = false }
log = "0.4"
semver = "1.0.20"

[dev-dependencies]
tempfile = "=3.27.0"
