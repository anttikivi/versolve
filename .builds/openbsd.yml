---
image: openbsd/latest

packages:
  - rust
  - rust-clippy

sources:
  - https://git.sr.ht/~anttikivi/versolve

tasks:
  - lint: |
      cd versolve
      cargo clippy --all-targets -- -D warnings

  - test: |
      cd versolve
      cargo test
